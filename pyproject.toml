[project]
name = "koopman-debate"
version = "0.1.0"
description = "Koopman operator theory of multi-agent LLM debate (EDMD, spectral criteria, Koopman-MPC)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "requests",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
